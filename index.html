<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình quản lý Quảng cáo - Auto Evaluation</title>
    <style>
        /* CSS reset & base */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; color: #1c1e21; }
        
        /* Navbar & Header */
        .navbar { background-color: #ffffff; border-bottom: 1px solid #dddfe2; padding: 10px 20px; display: flex; align-items: center; font-weight: bold; font-size: 18px; color: #1877f2; }
        .toolbar { padding: 15px 20px; background: #fff; border-bottom: 1px solid #dddfe2; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 14px; outline: none; min-width: 150px; }
        .toolbar button { background-color: #1877f2; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .toolbar button:hover { background-color: #166fe5; }
        
        /* Table Container */
        .table-container { margin: 20px; background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        thead { background-color: #f5f6f7; border-bottom: 2px solid #dddfe2; }
        th { padding: 12px 16px; font-weight: 600; color: #606770; white-space: nowrap; }
        td { padding: 12px 16px; border-bottom: 1px solid #dddfe2; vertical-align: middle; }
        tr:hover { background-color: #f5f6f7; }
        
        /* Status Toggle Mockup */
        .toggle { width: 34px; height: 18px; background: #1877f2; border-radius: 10px; position: relative; display: inline-block; }
        .toggle::after { content: ''; width: 14px; height: 14px; background: white; border-radius: 50%; position: absolute; top: 2px; right: 2px; }
        
        /* Badges */
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; text-align: center; min-width: 70px; }
        .badge.tot { background-color: #e4f3eb; color: #00a400; border: 1px solid #00a400; }
        .badge.kha { background-color: #fff8e1; color: #f2a100; border: 1px solid #f2a100; }
        .badge.theodoi { background-color: #fbe9e7; color: #ff5722; border: 1px solid #ff5722; }
        .badge.kem { background-color: #fae3e3; color: #fa383e; border: 1px solid #fa383e; }
        .badge.nodata { background-color: #f0f2f5; color: #606770; border: 1px solid #ccd0d5; }
        
        /* Utilities */
        .camp-name { font-weight: 600; color: #1c1e21; }
        .assignee { color: #1877f2; font-weight: 500; }
        .msg { padding: 20px; text-align: center; color: #606770; }
        .error { color: #fa383e; font-weight: 500; }
    </style>
</head>
<body>

    <div class="navbar">
        <svg width="24" height="24" viewBox="0 0 36 36" style="margin-right: 10px;"><path fill="#1877F2" d="M15 35.8C6.5 34.3 0 26.9 0 18 0 8.1 8.1 0 18 0s18 8.1 18 18c0 8.9-6.5 16.3-15 17.8l-1-8h3l1-4h-4v-2c0-1.1.9-2 2-2h2V6h-3c-3.3 0-6 2.7-6 6v2h-3v4h3v8l-1 8z"/></svg>
        Japanshop.vn - Performance Workspace
    </div>

    <div class="toolbar">
        <input type="text" id="accountId" placeholder="Ad Account ID">
        <input type="password" id="accessToken" placeholder="Access Token">
        <select id="datePreset">
            <option value="last_7d">7 ngày qua</option>
            <option value="last_30d">30 ngày qua</option>
            <option value="this_month">Tháng này</option>
        </select>
        <button onclick="fetchAdsData()">Tải Dữ Liệu & Đánh Giá</button>
    </div>

    <div class="table-container">
        <div id="loader" class="msg" style="display: none;">Đang đồng bộ dữ liệu và chạy thuật toán phân tích...</div>
        <div id="errorMessage" class="msg error"></div>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Bật/Tắt</th>
                    <th>Chiến dịch (Tên gốc)</th>
                    <th>Nhân sự</th>
                    <th>Ngành hàng</th>
                    <th>Chi tiêu (VNĐ)</th>
                    <th>CPA (VNĐ)</th>
                    <th>Hiệu suất</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" class="msg">Nhập Token và ID để bắt đầu.</td></tr>
            </tbody>
        </table>
    </div>

<script>
    // Hàm đánh giá hiệu suất dựa trên bộ chuẩn file CSV Thresholds
    function evaluateCampaign(category, spend, cpa) {
        if (!category) return { text: "Chưa phân loại", class: "nodata" };
        
        let cat = category.toLowerCase().trim();
        let minSpend = 0;
        let t_tot = 0, t_kha = 0, t_theodoi = 0;

        // Áp dụng luật từ Thresholds
        if (cat.includes("giày") || cat.includes("giay")) {
            minSpend = 450000;
            t_tot = 45000; t_kha = 65000; t_theodoi = 85000;
        } else if (cat.includes("gunze")) {
            minSpend = 300000;
            t_tot = 40000; t_kha = 60000; t_theodoi = 80000;
        } else if (cat.includes("mỹ phẩm") || cat.includes("my pham")) {
            minSpend = 300000;
            t_tot = 50000; t_kha = 70000; t_theodoi = 90000;
        } else {
            return { text: "Khác", class: "nodata" };
        }

        // Kiểm tra điều kiện chi tiêu tối thiểu
        if (spend < minSpend) {
            return { text: "Learning (Chưa đủ chi tiêu)", class: "nodata" };
        }

        // Chấm điểm theo CPA
        if (cpa === 0) return { text: "Kém (Không ra số)", class: "kem" };
        if (cpa < t_tot) return { text: "Tốt", class: "tot" };
        if (cpa <= t_kha) return { text: "Khá", class: "kha" };
        if (cpa <= t_theodoi) return { text: "Theo dõi", class: "theodoi" };
        return { text: "Kém/Dừng", class: "kem" };
    }

    async function fetchAdsData() {
        const accountId = document.getElementById('accountId').value.trim();
        const token = document.getElementById('accessToken').value.trim();
        const datePreset = document.getElementById('datePreset').value;
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMessage');
        const tableBody = document.getElementById('tableBody');

        errorMsg.innerHTML = '';
        tableBody.innerHTML = '';
        
        if (!accountId || !token) {
            errorMsg.innerHTML = 'Thiếu thông tin Ad Account ID hoặc Access Token.';
            return;
        }

        loader.style.display = 'block';

        const url = `https://graph.facebook.com/v20.0/act_${accountId}/insights?level=campaign&fields=campaign_name,spend,cost_per_action_type&date_preset=${datePreset}&access_token=${token}&limit=100`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.error) throw new Error(data.error.message);

            if (data.data && data.data.length > 0) {
                data.data.forEach(item => {
                    const campName = item.campaign_name || "Trống";
                    
                    let assignee = "Không xác định";
                    let category = "Không xác định";
                    
                    // Tách tên theo Naming Convention
                    let nameParts = campName.split(' - ');
                    if (nameParts.length >= 4) {
                        category = nameParts[1]; // Nhóm hàng
                        assignee = nameParts[2]; // Tên nhân sự
                    }

                    // Xử lý dữ liệu
                    const spendRaw = parseFloat(item.spend || 0);
                    const spendFmt = spendRaw.toLocaleString('vi-VN');
                    
                    let cpaRaw = 0;
                    if (item.cost_per_action_type) {
                        const purchaseAction = item.cost_per_action_type.find(a => a.action_type === 'purchase');
                        const messAction = item.cost_per_action_type.find(a => a.action_type === 'onsite_conversion.messaging_conversation_started_7d');
                        if (purchaseAction) cpaRaw = parseFloat(purchaseAction.value);
                        else if (messAction) cpaRaw = parseFloat(messAction.value);
                    }
                    const cpaFmt = cpaRaw > 0 ? cpaRaw.toLocaleString('vi-VN') : '0';

                    // Chấm điểm
                    const evaluation = evaluateCampaign(category, spendRaw, cpaRaw);

                    const row = `<tr>
                        <td><div class="toggle"></div></td>
                        <td class="camp-name">${campName}</td>
                        <td class="assignee">${assignee}</td>
                        <td>${category}</td>
                        <td>${spendFmt}</td>
                        <td>${cpaFmt}</td>
                        <td><span class="badge ${evaluation.class}">${evaluation.text}</span></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="7" class="msg">Không có dữ liệu phát sinh trong thời gian này.</td></tr>';
            }
        } catch (error) {
            errorMsg.innerHTML = 'Lỗi API: ' + error.message;
        } finally {
            loader.style.display = 'none';
        }
    }
</script>
</body>
</html>
